[project]
name = "scoutroom"
version = "0.1.0"
description = "Pipeline do ScoutRoom: JSON de partidas -> tabelas -> métricas -> arquivos estáticos para o site"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "numpy>=1.26",
  "scipy>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scoutroom = "scoutroom.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
